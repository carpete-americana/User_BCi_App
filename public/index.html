<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCi</title>
    <!-- Aplica o tema guardado antes do primeiro paint, para evitar flash claro->escuro -->
    <script src="./shell-tema.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>
     <div class="sidebar">
        <div class="sidebar-header">
            <img src="https://bcibizz.pt/assets/images/bci-extended.png" alt="Logo BCi">
        </div>
        <nav class="sidebar-menu" id="sidebar-menu">
            <!-- Será preenchido dinamicamente pelo router.js -->
        </nav>
        <span class="app-version-badge" id="appVersionBadge"></span>
    </div>

<div id="update-badge" class="update-notification">
  <div class="notification-content">
    <i class="fas fa-cloud-download-alt notification-icon"></i>
    <div class="notification-text">
      <span class="notification-title">Nova atualização disponível!</span>
    </div>
    <button id="download-update" class="notification-button">
      <span>Descarregar agora</span>
      <i class="fas fa-arrow-right button-icon"></i>
    </button>
  </div>
  
  <div id="download-progress-container" class="download-progress">
    <div class="progress-header">
      <span id="progress-info-text">A Descarregar atualização...</span>
      <span class="progress-percent" id="progress-text">0%</span>
    </div>
    <div class="progress-bar-container">
      <div id="download-progress-bar" class="progress-bar-fill"></div>
    </div>
  </div>
  
  <button id="restart-button" class="restart-button" style="display: none;">
    <i class="fas fa-sync-alt"></i>
    <span>Reiniciar para instalar</span>
  </button>
</div>

<script src="./shell-atualizacoes.js"></script>

<style>
  .restart-button {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .fa-spin {
    animation: fa-spin 1s infinite linear;
  }

  @keyframes fa-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(359deg); }
  }

  .app-version-badge {
    position: absolute;
    left: 20px;
    bottom: 12px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.3px;
    pointer-events: none;
    user-select: none;
  }
</style>

    <header class="main-header">
        <div class="search-bar">
        </div>
        
        <div class="header-right">
            <div class="notification" id="notificationBell">
                <i class="fas fa-bell"></i>
                <span class="notification-badge hidden" id="notificationBadge">0</span>
            </div>

            <div class="user-profile">
                <span class="user-name">Utilizador</span>
                <div class="avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </header>

    <div class="main-content" id="main-content">
        <!-- O conteúdo será injetado aqui pelo router -->
    </div>

    <script type="module" src="../src/renderer/index.js"></script>
    </div>

    <div class="notification-bell-dropdown" id="notificationBellDropdown">
        <div class="notification-bell-header">
            <h4>Notificações</h4>
            <button class="notification-bell-mark-all" id="notificationMarkAllBtn">Marcar todas como lidas</button>
        </div>
        <div class="notification-bell-list" id="notificationBellList"></div>
    </div>

    <div class="profile-card" id="profileCard">
    <div class="profile-header">
        <div class="profile-avatar">
            <i class="fas fa-user-circle"></i>
        </div>
        <div class="profile-info">
            <h3 class="user-name">Utilizador</h3>
            <p class="email-field">user@bcibizz.pt</p>
        </div>
    </div>
    
    <div class="profile-menu">
        <a href="#profile" class="profile-menu-item" onclick="navigateTo('profile'); document.getElementById('profileCard').classList.remove('show');">
            <i class="fas fa-user-cog"></i> Perfil
        </a>
        <a href="#settings" class="profile-menu-item" onclick="navigateTo('settings'); document.getElementById('profileCard').classList.remove('show');">
            <i class="fas fa-gear"></i> Definições
        </a>
        <div class="profile-divider"></div>
        <button class="profile-menu-item logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Terminar Sessão
        </button>
    </div>
</div>

<script src="./shell-ui.js"></script>
</body>
</html>
